<title>部署测试 · 秘密基地</title>
<style>
 body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#F6FBFF;color:#2C4A6B;font:16px/1.9 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
 .card{max-width:520px;margin:24px;padding:34px 30px;border:2px solid #C5E3F8;border-radius:22px;background:#fff;box-shadow:0 16px 36px rgba(74,144,217,.16);text-align:center}
 h1{margin:0 0 10px;font-size:1.24rem;color:#2F7FD4;letter-spacing:1px}
 .t{font-size:1.5rem;font-weight:800;color:#2F7FD4;letter-spacing:2px;margin:14px 0 4px;font-variant-numeric:tabular-nums}
 p{margin:6px 0;color:#5B7FA6;font-size:.92rem}
 a{display:inline-block;margin-top:20px;padding:10px 26px;border-radius:999px;background:linear-gradient(135deg,#4A90D9,#7FB2E5);color:#fff;text-decoration:none;font-weight:700;letter-spacing:1px}
 @media (prefers-color-scheme: dark){ body{background:#141C33;color:#C9D8F0} .card{background:#1B2A4E;border-color:#2E3F6E;box-shadow:0 16px 36px rgba(0,0,0,.5)} p{color:#93A7D6} }

<div class="card">
